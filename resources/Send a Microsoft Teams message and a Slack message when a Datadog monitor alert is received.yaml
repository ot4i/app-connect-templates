$integration: 'http://ibm.com/appconnect/integration/v2/integrationFile'
integration:
  type: trigger-action
  trigger-interfaces:
    trigger-interface-1:
      type: event-trigger
      connector-type: datadog
      triggers:
        newWebhookEvent:
          assembly:
            $ref: '#/integration/assemblies/assembly-1'
          input-context:
            data: Webhooks
          options:
            webhookURLSuffix: default
            connectorServiceOptions:
              httpMethod: post
              path: resources/Webhooks/operations/newWebhookEvent/subscribe
              action: created
  action-interfaces:
    action-interface-1:
      type: api-action
      business-object: Message
      connector-type: msteams
      actions:
        CREATE: {}
      options:
        connectorServiceOptions:
          httpMethod: post
          path: resources/Team/{teamId}/Channel/{channelId}/Message
          action: create
    action-interface-2:
      type: api-action
      business-object: message
      connector-type: slack
      actions:
        CREATE: {}
      options:
        connectorServiceOptions:
          httpMethod: post
          path: resources/{OBJECT_NAME}/{OBJECT_ID}/message
          action: create
  assemblies:
    assembly-1:
      assembly:
        execute:
          - create-action:
              name: Microsoft Teams Send message to channel
              target:
                $ref: '#/integration/action-interfaces/action-interface-1'
              map:
                mappings:
                  - body:
                      mappings:
                        - content:
                            template: |-
                              Priority: {{$Trigger.body.alert_priority}}
                              Scope: {{$Trigger.body.alert_scope}}
                              Query: {{$Trigger.body.alert_query}}

                              {{$Trigger.body.event_message}}

                              View in Datadog: {{$Trigger.body.link}}
                  - channelId:
                      template: your-ms-teams-channel-id
                  - subject:
                      template: '[{{$Trigger.body.alert_transition}}] {{$Trigger.body.alert_title}}'
                  - teamId:
                      template: your-ms-teams-team-id
                $map: http://ibm.com/appconnect/map/v1
                input:
                  - variable: Trigger
                    $ref: '#/trigger/payload'
                  - variable: flowDetails
                    $ref: '#/flowDetails'
          - create-action:
              name: Slack Send message
              target:
                $ref: '#/integration/action-interfaces/action-interface-2'
              map:
                mappings:
                  - OBJECT_ID:
                      template: your-slack-channel-id
                  - OBJECT_NAME:
                      template: channel
                  - text:
                      template: |-
                        *[{{$Trigger.body.alert_transition}}] {{$Trigger.body.alert_title}}*
                        Priority: {{$Trigger.body.alert_priority}}
                        Scope: {{$Trigger.body.alert_scope}}
                        Query: {{$Trigger.body.alert_query}}

                        {{$Trigger.body.event_message}}

                        View in Datadog: {{$Trigger.body.link}}
                $map: http://ibm.com/appconnect/map/v1
                input:
                  - variable: Trigger
                    $ref: '#/trigger/payload'
                  - variable: MicrosoftTeamsSendmessagetochannel
                    $ref: '#/node-output/Microsoft Teams Send message to channel/response/payload'
                  - variable: flowDetails
                    $ref: '#/flowDetails'
  name: Send a Microsoft Teams message and a Slack message when a Datadog monitor alert is received
  description: >-
    Triggered when a Datadog monitor sends an alert notification through a webhook. Sends a
    Microsoft Teams channel message and a Slack message with the alert transition, title, priority,
    scope, query, monitor message, and a link to the monitor in Datadog.
models: {}
